<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Мандарин">
  <defs>
    <radialGradient id="peel" cx="0.38" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.55" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ee6a0c"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fbf4a"/>
      <stop offset="1" stop-color="#23863a"/>
    </linearGradient>
  </defs>
  <!-- fruit: slightly wider than tall, like a tangerine -->
  <ellipse cx="32" cy="38" rx="26" ry="23" fill="url(#peel)"/>
  <!-- soft shine -->
  <ellipse cx="22" cy="29" rx="7" ry="4.5" fill="#ffffff" opacity="0.35" transform="rotate(-25 22 29)"/>
  <!-- stem dimple -->
  <ellipse cx="32" cy="16.5" rx="4" ry="1.8" fill="#c4520a" opacity="0.55"/>
  <!-- stem -->
  <path d="M32 17 C32 13 31.5 10.5 30.5 8.5" fill="none" stroke="#6b4a1f" stroke-width="2.6" stroke-linecap="round"/>
  <!-- leaf -->
  <path d="M32.5 12.5 C37 5 46 4 52 7 C47 14 39 16 32.5 12.5 Z" fill="url(#leaf)"/>
  <path d="M33.5 12 C39 9.5 44.5 8.5 49.5 7.6" fill="none" stroke="#1d6b2f" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
</svg>
